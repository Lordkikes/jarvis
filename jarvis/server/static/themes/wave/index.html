<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Jarvis</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="/static/themes/wave/styles.css" />
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect x='14' y='38' width='10' height='24' rx='5' fill='%236c5ce7'/><rect x='34' y='20' width='10' height='60' rx='5' fill='%236c5ce7'/><rect x='54' y='30' width='10' height='40' rx='5' fill='%2300b894'/><rect x='74' y='42' width='10' height='16' rx='5' fill='%2300b894'/></svg>" />
</head>
<body data-state="idle" data-theme="wave">

<header class="bar">
  <div class="identity">
    <span class="avatar" aria-hidden="true"><i></i></span>
    <div class="identity__text">
      <h1 id="brand-name">Jarvis</h1>
      <p id="status-text">En reposo</p>
    </div>
  </div>
  <div class="bar__actions">
    <button class="round" id="btn-mute" aria-pressed="false" title="Silenciar micrófono (M)">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    </button>
    <button class="round" id="btn-clear" title="Limpiar conversación">
      <svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V5h6v2M6 7l1 13h10l1-13"/></svg>
    </button>
    <span id="theme-slot"></span>
  </div>
</header>

<main class="chat" id="log"></main>

<div class="visualizer" id="visualizer">
  <canvas id="bars" width="900" height="120" aria-hidden="true"></canvas>
  <p class="visualizer__hint" id="status-hint">Di «Hey Jarvis»</p>
</div>

<footer class="composer">
  <form class="composer__form" id="form">
    <input class="composer__input" id="input" type="text" autocomplete="off"
           placeholder="Escribe un mensaje" aria-label="Mensaje para Jarvis" />
    <button class="composer__send" type="submit" title="Enviar" aria-label="Enviar">
      <svg viewBox="0 0 24 24"><path d="M4.5 11.6 19 5.2a.6.6 0 0 1 .8.8l-6.4 14.5a.6.6 0 0 1-1.1 0l-2.5-5.6-5.6-2.5a.6.6 0 0 1 0-1.1Z"/></svg>
    </button>
  </form>
  <button class="talk" id="btn-mic" title="Hablar (espacio)">
    <svg class="talk__mic" viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Z"/><path d="M19 11a7 7 0 0 1-14 0M12 18v3"/></svg>
    <svg class="talk__stop" viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="2.5"/></svg>
  </button>
</footer>

<script src="/static/shared/client.js"></script>
<script src="/static/themes/wave/theme.js"></script>
</body>
</html>
