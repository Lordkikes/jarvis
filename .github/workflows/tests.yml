name: pruebas

on:
  push:
    branches: [main]
  pull_request:

# Una serie por rama: un push nuevo cancela la ejecución anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: pruebas · Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar el núcleo
        # Sin la parte de voz a propósito: las pruebas están escritas para
        # funcionar sin micrófono, y así la serie tarda segundos.
        run: pip install -r requirements.txt

      - name: Pruebas
        run: python -m unittest discover -s tests -v

      - name: La configuración apunta a un tema que existe
        run: python scripts/check_config.py

      - name: El servidor arranca y sirve los cinco temas
        env:
          # El cliente de Anthropic exige credencial al construirse; aquí no
          # se llega a llamar a la API.
          ANTHROPIC_API_KEY: clave-de-prueba
        run: bash scripts/ci_smoke.sh

  cancelacion-de-eco:
    name: pruebas con cancelación de eco
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-aec.txt

      - name: Herramientas de compilación
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends swig

      - name: Instalar con webrtc-audio-processing
        # Se compila (unos minutos). Es el único trabajo donde las pruebas que
        # miden la cancelación real sobre eco simulado llegan a ejecutarse.
        run: pip install -r requirements.txt -r requirements-aec.txt

      - name: Pruebas
        # shell: bash activa pipefail; sin él, el código de salida sería el de
        # tee y un fallo de las pruebas pasaría desapercibido.
        shell: bash
        run: python -m unittest discover -s tests -v 2>&1 | tee salida.txt

      - name: Comprobar que el AEC se ha ejercitado de verdad
        run: |
          grep -q "test_echo_is_actually_cancelled" salida.txt
          if grep -q "webrtc-audio-processing no está instalado" salida.txt; then
            echo "::error::las pruebas de cancelación de eco se saltaron; la librería no llegó a instalarse"
            exit 1
          fi

  interfaz:
    name: interfaz
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Sintaxis de los temas y del cliente
        run: |
          find jarvis/server/static -name "*.js" -print0 |
            xargs -0 -n1 node --check

      - name: Cada tema tiene sus tres piezas
        run: |
          for theme in jarvis/server/static/themes/*/; do
            for file in index.html styles.css theme.js; do
              test -f "$theme$file" || { echo "::error::falta $theme$file"; exit 1; }
            done
          done
